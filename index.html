<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strangewave Effects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs:  clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-2xl: clamp(1.5rem,  1rem   + 2vw,    3rem);
      --space-2: 0.5rem; --space-4: 1rem; --space-6: 1.5rem;
      --space-8: 2rem;   --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem;
      --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
      --font-body: "Barlow", "Helvetica Neue", sans-serif;
      --color-bg: #0a0a0a;
      --color-navy: #1f3148;
      --color-accent: #ea3b01;
      --color-text: #e8e4de;
      --color-text-muted: #8a8580;
      --color-text-faint: #4a4845;
      --color-divider: rgba(232,228,222,0.06);
      --transition: 180ms cubic-bezier(0.16,1,0.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      overflow-x: hidden;
    }

    p { text-wrap: pretty; }
    a { color: inherit; text-decoration: none; transition: color var(--transition); }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.038;
      pointer-events: none;
      z-index: 1000;
    }

    #wave-canvas {
      position: fixed; inset: 0;
      z-index: 0;
      pointer-events: none;
      touch-action: none;
    }

    .page {
      position: relative; z-index: 1;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-16) var(--space-8);
      position: relative;
    }

    .site-logo {
      width: min(680px, 78vw);
      margin-bottom: var(--space-4);
    }
    .site-logo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .tagline {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: var(--space-10);
      line-height: 1;
    }

    .hero-body {
      max-width: 50ch;
      font-size: clamp(0.9rem, 0.85rem + 0.5vw, 1.125rem);
      color: var(--color-text-muted);
      line-height: 1.65;
    }

    .circuit-line {
      position: absolute;
      right: var(--space-8);
      top: var(--space-16); bottom: var(--space-16);
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        var(--color-navy) 0px, var(--color-navy) 8px,
        transparent 8px, transparent 14px
      );
      opacity: 0.5;
    }
    .circuit-dot {
      position: absolute;
      right: calc(var(--space-8) - 4px);
      width: 9px; height: 9px;
      border-radius: 50%;
      border: 1px solid var(--color-accent);
      background: var(--color-bg);
    }
    .circuit-dot.top { top: var(--space-16); }
    .circuit-dot.mid { top: 50%; transform: translateY(-50%); background: var(--color-accent); }
    .circuit-dot.bot { bottom: var(--space-16); }

    footer {
      padding: var(--space-6) var(--space-8);
      border-top: 1px solid var(--color-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
    }
    .footer-copy { font-size: var(--text-xs); color: var(--color-text-faint); letter-spacing: 0.06em; }
    .footer-links { display: flex; gap: var(--space-6); list-style: none; }
    .footer-links a {
      font-size: var(--text-xs);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      transition: color var(--transition);
    }
    .footer-links a:hover { color: var(--color-accent); }

    @media (max-width: 640px) {
      main { padding: var(--space-12) var(--space-6); justify-content: center; }
      .site-logo { width: min(340px, 88vw); }
      .tagline { margin-bottom: var(--space-8); }
      footer { padding: var(--space-4) var(--space-6); }
      .circuit-line, .circuit-dot { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <canvas id="wave-canvas" aria-hidden="true"></canvas>

  <div class="page">
    <main>
      <div class="circuit-line" aria-hidden="true"></div>
      <div class="circuit-dot top" aria-hidden="true"></div>
      <div class="circuit-dot mid" aria-hidden="true"></div>
      <div class="circuit-dot bot" aria-hidden="true"></div>

      <div class="site-logo" role="img" aria-label="Strangewave Effects">
        <img src="images/sw_logo.svg" alt="Strangewave Effects" />
      </div>

      <p class="tagline">Sound Affects</p>
      <p class="hero-body">Handbuilt effects pedals crafted in Newcastle, NSW.</p>
    </main>

    <footer>
      <p class="footer-copy">&copy; 2026 Strangewave Effects</p>
      <ul class="footer-links">
        <li><a href="https://www.instagram.com/strangewaveeffects/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      </ul>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');

    let pointer = { x: -9999, y: -9999 };
    let smooth  = { x: -9999, y: -9999 };
    let hasPointer = false;
    let fadeOut = 0;

    function setPointer(x, y) {
      pointer.x = x; pointer.y = y;
      hasPointer = true; fadeOut = 0;
    }
    function clearPointer() { hasPointer = false; }

    // Mouse
    window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
    window.addEventListener('mouseleave', clearPointer);

    // Touch
    window.addEventListener('touchstart', e => {
      const t = e.touches[0]; setPointer(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      const t = e.touches[0]; setPointer(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchend', clearPointer);
    window.addEventListener('touchcancel', clearPointer);

    const ROW_H = 6, GAP = 3, STEP = 9;
    const BASE_AMP = 2.2, FREQ = 0.022, PHASE_SPEED = 0.014;
    const DIST_RADIUS = 180, DIST_AMP = 28;
    const CHAOS_FREQ = 0.07, CHAOS_AMP = 18;
    const RIPPLE_FREQ = 0.04, RIPPLE_AMP = 14;

    let phase = 0, ripplePhase = 0;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    window.visualViewport && window.visualViewport.addEventListener('resize', resize);

    function draw() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      if (hasPointer) {
        smooth.x += (pointer.x - smooth.x) * 0.1;
        smooth.y += (pointer.y - smooth.y) * 0.1;
        fadeOut = Math.min(1, fadeOut + 0.05);
      } else {
        fadeOut = Math.max(0, fadeOut - 0.04);
      }

      const rows = Math.ceil(H / STEP) + 2;
      const PTS  = Math.ceil(W / 2) + 2;

      for (let r = 0; r < rows; r++) {
        const baseY = r * STEP + ROW_H / 2;
        ctx.strokeStyle = `rgba(234,59,1,${0.18 + (r % 3) * 0.04})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();

        for (let i = 0; i <= PTS; i++) {
          const x = (i / PTS) * W;
          let y = baseY + Math.sin(x * FREQ + phase + r * 0.55) * BASE_AMP;

          if (fadeOut > 0 && smooth.x > -100) {
            const dx = x - smooth.x, dy = baseY - smooth.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < DIST_RADIUS) {
              const falloff = Math.pow(1 - dist / DIST_RADIUS, 3) * fadeOut;
              y += Math.sin(x * FREQ + phase + r * 0.55) * DIST_AMP * falloff;
              y += Math.sin(x * CHAOS_FREQ - phase * 2.1 + r * 1.3) * CHAOS_AMP * falloff;
              y += Math.sin(dist * RIPPLE_FREQ - ripplePhase) * RIPPLE_AMP * falloff;
            }
          }

          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      phase += PHASE_SPEED;
      ripplePhase += 0.08;
      requestAnimationFrame(draw);
    }

    draw();
  </script>

</body>
</html>
