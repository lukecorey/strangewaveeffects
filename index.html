<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strangewave Effects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
      --text-2xl:  clamp(2rem,     1.2rem  + 2.5vw,  3.5rem);
      --text-hero: clamp(4.5rem,   1rem    + 10vw,   12rem);
      --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
      --font-body: "Barlow", "Helvetica Neue", sans-serif;
      --color-bg: #0a0a0a;
      --color-navy: #1f3148;
      --color-accent: #ea3b01;
      --color-accent-dim: rgba(234, 59, 1, 0.14);
      --color-text: #e8e4de;
      --color-text-muted: #8a8580;
      --color-text-faint: #4a4845;
      --color-divider: rgba(232, 228, 222, 0.06);
      --radius-sm: 0.25rem;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      overflow-x: hidden;
    }
    p { text-wrap: pretty; }
    h1 { text-wrap: balance; }
    a { color: inherit; text-decoration: none; transition: color var(--transition); }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.038;
      pointer-events: none;
      z-index: 1000;
    }

    #wave-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-16) var(--space-8);
      position: relative;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--color-accent-dim);
      border: 1px solid rgba(234, 59, 1, 0.28);
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-4);
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: var(--space-8);
      width: fit-content;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.65); }
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--text-hero);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.9;
      color: var(--color-text);
      margin-bottom: var(--space-4);
    }

    h1 .line-two { color: var(--color-accent); display: block; }

    .tagline {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: var(--space-10);
      line-height: 1;
    }

    .hero-body {
      max-width: 50ch;
      font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      color: var(--color-text-muted);
      line-height: 1.65;
    }

    .circuit-line {
      position: absolute;
      right: var(--space-8);
      top: var(--space-16);
      bottom: var(--space-16);
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        var(--color-navy) 0px, var(--color-navy) 8px,
        transparent 8px, transparent 14px
      );
      opacity: 0.5;
    }

    .circuit-dot {
      position: absolute;
      right: calc(var(--space-8) - 4px);
      width: 9px; height: 9px;
      border-radius: 50%;
      border: 1px solid var(--color-accent);
      background: var(--color-bg);
    }
    .circuit-dot.top { top: var(--space-16); }
    .circuit-dot.mid { top: 50%; transform: translateY(-50%); background: var(--color-accent); }
    .circuit-dot.bot { bottom: var(--space-16); }

    footer {
      padding: var(--space-6) var(--space-8);
      border-top: 1px solid var(--color-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
    }

    .footer-copy { font-size: var(--text-xs); color: var(--color-text-faint); letter-spacing: 0.06em; }
    .footer-links { display: flex; gap: var(--space-6); list-style: none; }
    .footer-links a {
      font-size: var(--text-xs);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      transition: color var(--transition);
    }
    .footer-links a:hover { color: var(--color-accent); }

    @media (max-width: 640px) {
      main { padding: var(--space-12) var(--space-4); }
      footer { padding: var(--space-4) var(--space-4); }
      .circuit-line, .circuit-dot { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
    }
  </style>
</head>
<body>

  <canvas id="wave-canvas" aria-hidden="true"></canvas>

  <div class="page">
    <main>
      <div class="circuit-line" aria-hidden="true"></div>
      <div class="circuit-dot top" aria-hidden="true"></div>
      <div class="circuit-dot mid" aria-hidden="true"></div>
      <div class="circuit-dot bot" aria-hidden="true"></div>

      <div class="status-badge">
        <span class="status-dot" aria-hidden="true"></span>
        Coming soon
      </div>

      <h1>
        Strangewave
        <span class="line-two">Effects</span>
      </h1>

      <p class="tagline">Sound Affects</p>
      <p class="hero-body">Handbuilt effects pedals crafted in Newcastle, NSW.</p>
    </main>

    <footer>
      <p class="footer-copy">&copy; 2026 Strangewave Effects</p>
      <ul class="footer-links">
        <li><a href="https://www.instagram.com/strangewaveeffects/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
      </ul>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');

    let mouse = { x: -9999, y: -9999 };
    let smooth = { x: -9999, y: -9999 };

    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    // Wave config
    const ROW_H   = 6;     // row height — very dense
    const GAP     = 3;     // gap between rows
    const STEP    = ROW_H + GAP;
    const BASE_AMP = 2.2;  // tight base amplitude
    const FREQ    = 0.022; // x frequency
    const PHASE_SPEED = 0.014;

    // Distortion config — no sphere, just chaotic local distortion
    const DIST_RADIUS  = 180;  // area of influence
    const DIST_AMP     = 28;   // max distortion amplitude boost
    const CHAOS_FREQ   = 0.07; // secondary chaotic frequency
    const CHAOS_AMP    = 18;   // chaos amplitude
    const RIPPLE_FREQ  = 0.04; // ripple outward from cursor
    const RIPPLE_AMP   = 14;

    let phase = 0;
    let ripplePhase = 0;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Lerp mouse
      const lerpFactor = 0.1;
      if (mouse.x > -100) {
        smooth.x += (mouse.x - smooth.x) * lerpFactor;
        smooth.y += (mouse.y - smooth.y) * lerpFactor;
      }

      const rows = Math.ceil(H / STEP) + 2;
      const PTS  = Math.ceil(W / 2) + 2;

      for (let r = 0; r < rows; r++) {
        const baseY = r * STEP + ROW_H / 2;

        // Vary opacity slightly by row for depth
        const opacity = 0.18 + (r % 3) * 0.04;
        ctx.strokeStyle = `rgba(234,59,1,${opacity})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();

        for (let i = 0; i <= PTS; i++) {
          const x = (i / PTS) * W;

          // Base wave
          let y = baseY + Math.sin(x * FREQ + phase + r * 0.55) * BASE_AMP;

          // Distortion zone — no sphere push, just amplitude/chaos increase
          if (smooth.x > -100) {
            const dx = x - smooth.x;
            const dy = baseY - smooth.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < DIST_RADIUS) {
              const t = 1 - dist / DIST_RADIUS;
              const falloff = t * t * t; // cubic — sharp center, gentle edge

              // 1. Amplify the base wave dramatically near cursor
              const ampBoost = Math.sin(x * FREQ + phase + r * 0.55) * DIST_AMP * falloff;

              // 2. Add a secondary chaotic wave — different freq & phase offset
              const chaos = Math.sin(x * CHAOS_FREQ - phase * 2.1 + r * 1.3) * CHAOS_AMP * falloff;

              // 3. Ripple outward from cursor centre (distance-based oscillation)
              const ripple = Math.sin(dist * RIPPLE_FREQ - ripplePhase) * RIPPLE_AMP * falloff;

              y += ampBoost + chaos + ripple;
            }
          }

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.stroke();
      }

      phase       += PHASE_SPEED;
      ripplePhase += 0.08;
      requestAnimationFrame(draw);
    }

    draw();
  </script>

</body>
</html>
